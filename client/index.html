<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AstroBrawl - Dark Orbit 2D Multiplayer Space Shooter</title>
    
    <link data-trunk rel="copy-file" href="mq_js_bundle.js" />
    <link data-trunk rel="copy-file" href="vercel.json" />
    <link data-trunk rel="copy-file" href="../target/wasm32-unknown-unknown/release/astrobrawl-client.wasm" />

    <style>
        :root {
            /* Catppuccin Mocha Palette */
            --ctp-rosewater: #f5e0dc;
            --ctp-flamingo: #f2cdcd;
            --ctp-pink: #f5c2e7;
            --ctp-mauve: #cba6f7;
            --ctp-red: #f38ba8;
            --ctp-maroon: #eba0ac;
            --ctp-peach: #fab387;
            --ctp-yellow: #f9e2af;
            --ctp-green: #a6e3a1;
            --ctp-teal: #94e2d5;
            --ctp-sky: #89dceb;
            --ctp-sapphire: #74c7ec;
            --ctp-blue: #89b4fa;
            --ctp-lavender: #b4befe;
            --ctp-text: #cdd6f4;
            --ctp-subtext1: #bac2de;
            --ctp-subtext0: #a6adc8;
            --ctp-overlay2: #9399b2;
            --ctp-overlay1: #7f849c;
            --ctp-overlay0: #6c7086;
            --ctp-surface2: #585b70;
            --ctp-surface1: #45475a;
            --ctp-surface0: #313244;
            --ctp-base: #1e1e2e;
            --ctp-mantle: #181825;
            --ctp-crust: #11111b;

            --bg-dark: var(--ctp-crust);
            --panel-bg: rgba(24, 24, 37, 0.95);
            --panel-border: var(--ctp-surface1);
            --primary: var(--ctp-mauve);
            --primary-glow: rgba(203, 166, 247, 0.35);
            --text-main: var(--ctp-text);
            --text-muted: var(--ctp-subtext0);
            --font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-family);
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #glcanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            outline: none;
            display: block;
            z-index: 1;
            cursor: crosshair;
        }

        /* Killfeed / Log Box */
        #killfeed {
            position: absolute;
            top: 70px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }

        .killfeed-item {
            background: var(--panel-bg);
            border-left: 3px solid var(--ctp-peach);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            color: var(--ctp-text);
            animation: fadeIn 0.3s ease;
        }

        /* Login / Connect Modal */
        #auth-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(30, 30, 46, 0.90) 0%, rgba(17, 17, 27, 0.98) 100%);
            backdrop-filter: blur(10px);
            transition: opacity 0.3s ease;
        }

        #auth-overlay.hidden {
            display: none;
            opacity: 0;
            pointer-events: none;
        }

        .auth-card {
            width: 460px;
            max-width: 90vw;
            background: var(--ctp-mantle);
            border: 1.5px solid var(--ctp-mauve);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 0 40px var(--primary-glow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--ctp-mauve), transparent);
        }

        .game-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--ctp-text) 0%, var(--ctp-mauve) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 13px;
            color: var(--ctp-subtext0);
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            border: none;
        }

        .btn-github {
            background: var(--ctp-surface0);
            color: var(--ctp-text);
            border: 1px solid var(--ctp-surface2);
        }
        .btn-github:hover {
            background: var(--ctp-surface1);
            border-color: var(--ctp-mauve);
            box-shadow: 0 0 15px rgba(203, 166, 247, 0.25);
        }

        .btn-guest {
            background: linear-gradient(135deg, #1e66f5, #04a5e5);
            color: #fff;
        }
        .btn-guest:hover {
            background: linear-gradient(135deg, #7287fd, #209fb5);
            box-shadow: 0 0 20px rgba(114, 135, 253, 0.4);
            transform: translateY(-1px);
        }

        .input-group {
            margin-top: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--ctp-subtext0);
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            background: var(--ctp-surface0);
            border: 1px solid var(--ctp-surface1);
            border-radius: 6px;
            color: var(--ctp-text);
            font-size: 13px;
            outline: none;
        }
        .input-field:focus {
            border-color: var(--ctp-mauve);
            box-shadow: 0 0 10px var(--primary-glow);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Killfeed -->
        <div id="killfeed"></div>

        <!-- Auth & Connection Overlay -->
        <div id="auth-overlay">
            <div class="auth-card">
                <div class="game-title">⚡ ASTROBRAWL ⚡</div>
                <div class="game-subtitle">Multijoueur Spatial 2D • Dark Orbit Style</div>

                <div class="input-group" style="margin-top: 0; margin-bottom: 14px;">
                    <label for="pilot-callsign">👨‍🚀 Nom de Code / Pseudo du Commandant :</label>
                    <input type="text" id="pilot-callsign" class="input-field" placeholder="ex: Chomiam" value="Chomiam">
                </div>

                <div class="auth-buttons">
                    <button id="btn-login-guest" class="btn btn-guest">
                        🚀 Jouer Immédiatement (Mode Invité / Solo)
                    </button>

                    <button id="btn-login-github" class="btn btn-github">
                        <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                        </svg>
                        Connexion avec GitHub
                    </button>
                </div>

                <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4;">
                    ✨ Cliquez sur "Jouer Immédiatement" ou associez votre profil GitHub pour décoller !
                </div>

                <div class="input-group">
                    <label for="server-url">URL du Serveur Multijoueur :</label>
                    <input type="text" id="server-url" class="input-field" value="" placeholder="ws://localhost:3000/ws">
                </div>
            </div>
        </div>

        <!-- GitHub Profile Modal -->
        <div id="github-modal" class="modal-overlay hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 110; display: none; align-items: center; justify-content: center; background: rgba(5, 7, 15, 0.95); backdrop-filter: blur(8px);">
            <div class="auth-card">
                <div class="game-title" style="font-size: 24px;">PILOTE GITHUB</div>
                <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 18px;">
                    Associez votre compte GitHub pour afficher votre avatar et votre identifiant de commandant !
                </div>

                <div class="input-group" style="margin-top: 0;">
                    <label for="github-username">Nom d'utilisateur GitHub :</label>
                    <input type="text" id="github-username" class="input-field" placeholder="ex: Chomiam" value="Chomiam">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 18px;">
                    <button id="btn-validate-github" class="btn btn-github" style="flex: 1;">
                        ⭐ Valider le Profil
                    </button>
                    <button id="btn-cancel-github" class="btn" style="background: rgba(255,255,255,0.1); color: #fff; width: 90px;">
                        Retour
                    </button>
                </div>

                <div id="github-status" style="margin-top: 12px; font-size: 12px; min-height: 18px;"></div>
            </div>
        </div>

        <!-- Macroquad Canvas -->
        <canvas id="glcanvas" tabindex="1"></canvas>
    </div>

    <!-- Macroquad WebGL / WASM Loader -->
    <script src="mq_js_bundle.js"></script>
    <script>
        // Prevent default Tab key navigation so game controls capture Tab targeting
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
            }
        });

        // Server URL configuration
        const defaultWsUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + 
                             (window.location.hostname === 'localhost' ? 'localhost:3000' : window.location.host) + '/ws';
        
        const serverInput = document.getElementById('server-url');
        serverInput.value = localStorage.getItem('astrobrawl_server_url') || defaultWsUrl;

        serverInput.addEventListener('change', () => {
            localStorage.setItem('astrobrawl_server_url', serverInput.value);
        });

        // Check URL search parameters for OAuth callback token
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        if (tokenFromUrl) {
            localStorage.setItem('astrobrawl_auth_token', tokenFromUrl);
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // GitHub Modal handling
        const ghModal = document.getElementById('github-modal');
        const ghStatus = document.getElementById('github-status');

        document.getElementById('btn-login-github').addEventListener('click', (e) => {
            e.preventDefault();
            ghModal.style.display = 'flex';
            document.getElementById('github-username').focus();
        });

        document.getElementById('btn-cancel-github').addEventListener('click', () => {
            ghModal.style.display = 'none';
        });

        document.getElementById('btn-validate-github').addEventListener('click', async () => {
            const usernameInput = document.getElementById('github-username').value.trim();
            if (!usernameInput) {
                ghStatus.style.color = 'var(--accent-orange)';
                ghStatus.innerText = 'Veuillez saisir un pseudo GitHub.';
                return;
            }

            ghStatus.style.color = 'var(--primary)';
            ghStatus.innerText = 'Vérification du profil GitHub en cours...';

            try {
                const res = await fetch(`https://api.github.com/users/${encodeURIComponent(usernameInput)}`);
                if (res.ok) {
                    const profile = await res.json();
                    localStorage.setItem('astrobrawl_username', profile.login);
                    localStorage.setItem('astrobrawl_auth_token', 'gh_' + profile.id);
                    localStorage.setItem('astrobrawl_avatar', profile.avatar_url);
                    ghStatus.style.color = 'var(--accent-green)';
                    ghStatus.innerText = `Connecté avec succès : @${profile.login} !`;
                    setTimeout(() => {
                        ghModal.style.display = 'none';
                        startGameSession('gh_' + profile.id, profile.login);
                    }, 600);
                } else {
                    localStorage.setItem('astrobrawl_username', usernameInput);
                    localStorage.setItem('astrobrawl_auth_token', 'gh_custom');
                    ghModal.style.display = 'none';
                    startGameSession('gh_custom', usernameInput);
                }
            } catch (err) {
                localStorage.setItem('astrobrawl_username', usernameInput);
                localStorage.setItem('astrobrawl_auth_token', 'gh_custom');
                ghModal.style.display = 'none';
                startGameSession('gh_custom', usernameInput);
            }
        });

        // Prefill callsign & GitHub input from localStorage
        const storedUsername = localStorage.getItem('astrobrawl_username') || 'Chomiam';
        const callsignInput = document.getElementById('pilot-callsign');
        if (callsignInput) callsignInput.value = storedUsername;
        const ghInput = document.getElementById('github-username');
        if (ghInput) ghInput.value = storedUsername;

        // Guest login click
        document.getElementById('btn-login-guest').addEventListener('click', async () => {
            const inputVal = (callsignInput ? callsignInput.value.trim() : '') || storedUsername;
            localStorage.setItem('astrobrawl_username', inputVal);
            startGameSession('guest_offline', inputVal);
        });

        function startGameSession(token, username) {
            localStorage.setItem('astrobrawl_username', username);
            document.getElementById('auth-overlay').classList.add('hidden');
            const avatarUrl = localStorage.getItem('astrobrawl_avatar');
            const playerSpan = document.getElementById('hud-player');
            if (playerSpan) {
                if (avatarUrl) {
                    playerSpan.innerHTML = `<img src="${avatarUrl}" style="width: 18px; height: 18px; border-radius: 50%; vertical-align: middle; margin-right: 5px;"> ${username}`;
                } else {
                    playerSpan.innerText = username || 'Pilote';
                }
            }
            document.getElementById('glcanvas').focus();
        }

        // Auto-login if token exists
        const storedToken = localStorage.getItem('astrobrawl_auth_token');
        if (storedToken) {
            startGameSession(storedToken, storedUsername);
        }

        function triggerKey(keyChar) {
            const canvas = document.getElementById('glcanvas');
            canvas.focus();
            const keyCode = keyChar.toUpperCase().charCodeAt(0);
            const eventDown = new KeyboardEvent('keydown', { key: keyChar, code: 'Key' + keyChar.toUpperCase(), keyCode: keyCode, which: keyCode, bubbles: true });
            window.dispatchEvent(eventDown);
            setTimeout(() => {
                const eventUp = new KeyboardEvent('keyup', { key: keyChar, code: 'Key' + keyChar.toUpperCase(), keyCode: keyCode, which: keyCode, bubbles: true });
                window.dispatchEvent(eventUp);
            }, 60);
        }

        // --- Web Audio API Procedural Sci-Fi SFX Engine ---
        const SfxEngine = {
            ctx: null,
            muted: false,
            init: function() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            toggleMute: function() {
                this.muted = !this.muted;
                return this.muted;
            },
            play: function(id) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const ctx = this.ctx;
                const now = ctx.currentTime;

                try {
                    switch (id) {
                        case 1: // Laser Shot (Dual-sine frequency sweep)
                            {
                                const osc = ctx.createOscillator();
                                const gain = ctx.createGain();
                                osc.type = 'sawtooth';
                                osc.frequency.setValueAtTime(880, now);
                                osc.frequency.exponentialRampToValueAtTime(140, now + 0.13);
                                gain.gain.setValueAtTime(0.20, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

                                const filter = ctx.createBiquadFilter();
                                filter.type = 'lowpass';
                                filter.frequency.setValueAtTime(2600, now);
                                filter.frequency.exponentialRampToValueAtTime(500, now + 0.13);

                                osc.connect(filter);
                                filter.connect(gain);
                                gain.connect(ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.14);
                            }
                            break;

                        case 2: // Thermal Mining Laser Beam Hum
                            {
                                const osc = ctx.createOscillator();
                                const gain = ctx.createGain();
                                osc.type = 'triangle';
                                osc.frequency.setValueAtTime(140, now);
                                osc.frequency.linearRampToValueAtTime(185, now + 0.14);
                                gain.gain.setValueAtTime(0.12, now);
                                gain.gain.linearRampToValueAtTime(0.001, now + 0.14);
                                osc.connect(gain);
                                gain.connect(ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.15);
                            }
                            break;

                        case 3: // Explosion Blast
                            {
                                const osc = ctx.createOscillator();
                                const gain = ctx.createGain();
                                osc.type = 'sawtooth';
                                osc.frequency.setValueAtTime(160, now);
                                osc.frequency.exponentialRampToValueAtTime(28, now + 0.42);
                                gain.gain.setValueAtTime(0.35, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);

                                const bufferSize = Math.floor(ctx.sampleRate * 0.4);
                                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                                const data = buffer.getChannelData(0);
                                for (let i = 0; i < bufferSize; i++) {
                                    data[i] = Math.random() * 2 - 1;
                                }
                                const noise = ctx.createBufferSource();
                                noise.buffer = buffer;
                                const nFilter = ctx.createBiquadFilter();
                                nFilter.type = 'lowpass';
                                nFilter.frequency.setValueAtTime(650, now);
                                nFilter.frequency.exponentialRampToValueAtTime(35, now + 0.4);
                                const nGain = ctx.createGain();
                                nGain.gain.setValueAtTime(0.28, now);
                                nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                                noise.connect(nFilter);
                                nFilter.connect(nGain);
                                nGain.connect(ctx.destination);
                                noise.start(now);

                                osc.connect(gain);
                                gain.connect(ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.44);
                            }
                            break;

                        case 4: // Target Lock-on (Tab)
                            {
                                const osc1 = ctx.createOscillator();
                                const gain1 = ctx.createGain();
                                osc1.type = 'sine';
                                osc1.frequency.setValueAtTime(1420, now);
                                gain1.gain.setValueAtTime(0.18, now);
                                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                                osc1.connect(gain1);
                                gain1.connect(ctx.destination);
                                osc1.start(now);
                                osc1.stop(now + 0.06);

                                const osc2 = ctx.createOscillator();
                                const gain2 = ctx.createGain();
                                osc2.type = 'sine';
                                osc2.frequency.setValueAtTime(2150, now + 0.06);
                                gain2.gain.setValueAtTime(0.18, now + 0.06);
                                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                                osc2.connect(gain2);
                                gain2.connect(ctx.destination);
                                osc2.start(now + 0.06);
                                osc2.stop(now + 0.15);
                            }
                            break;

                        case 5: // Target Unlock / Lost
                            {
                                const osc = ctx.createOscillator();
                                const gain = ctx.createGain();
                                osc.type = 'sine';
                                osc.frequency.setValueAtTime(640, now);
                                osc.frequency.exponentialRampToValueAtTime(220, now + 0.10);
                                gain.gain.setValueAtTime(0.12, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
                                osc.connect(gain);
                                gain.connect(ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.11);
                            }
                            break;

                        case 6: // Mineral / Loot Box Pick-Up Chime
                            {
                                const notes = [659.25, 830.61, 1046.50];
                                notes.forEach((freq, idx) => {
                                    const noteTime = now + (idx * 0.055);
                                    const osc = ctx.createOscillator();
                                    const gain = ctx.createGain();
                                    osc.type = 'sine';
                                    osc.frequency.setValueAtTime(freq, noteTime);
                                    gain.gain.setValueAtTime(0.18, noteTime);
                                    gain.gain.exponentialRampToValueAtTime(0.001, noteTime + 0.16);
                                    osc.connect(gain);
                                    gain.connect(ctx.destination);
                                    osc.start(noteTime);
                                    osc.stop(noteTime + 0.18);
                                });
                            }
                            break;

                        case 7: // Level Up Fanfare
                            {
                                const chord = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                                chord.forEach((freq, idx) => {
                                    const noteTime = now + (idx * 0.065);
                                    const osc = ctx.createOscillator();
                                    const gain = ctx.createGain();
                                    osc.type = 'triangle';
                                    osc.frequency.setValueAtTime(freq, noteTime);
                                    gain.gain.setValueAtTime(0.20, noteTime);
                                    gain.gain.exponentialRampToValueAtTime(0.001, noteTime + 0.35);
                                    osc.connect(gain);
                                    gain.connect(ctx.destination);
                                    osc.start(noteTime);
                                    osc.stop(noteTime + 0.38);
                                });
                            }
                            break;

                        case 8: // Portal Jump / Warp Whoosh
                            {
                                const osc = ctx.createOscillator();
                                const gain = ctx.createGain();
                                osc.type = 'sine';
                                osc.frequency.setValueAtTime(80, now);
                                osc.frequency.exponentialRampToValueAtTime(620, now + 0.55);
                                gain.gain.setValueAtTime(0.01, now);
                                gain.gain.linearRampToValueAtTime(0.26, now + 0.35);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.60);
                                osc.connect(gain);
                                gain.connect(ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.65);
                            }
                            break;

                        case 9: // Shield Impact Zap
                            {
                                const osc = ctx.createOscillator();
                                const gain = ctx.createGain();
                                osc.type = 'sawtooth';
                                osc.frequency.setValueAtTime(1300, now);
                                osc.frequency.exponentialRampToValueAtTime(340, now + 0.08);
                                gain.gain.setValueAtTime(0.20, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                                osc.connect(gain);
                                gain.connect(ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.10);
                            }
                            break;

                        case 10: // Hull Damage Impact
                            {
                                const osc = ctx.createOscillator();
                                const gain = ctx.createGain();
                                osc.type = 'square';
                                osc.frequency.setValueAtTime(95, now);
                                osc.frequency.exponentialRampToValueAtTime(35, now + 0.14);
                                gain.gain.setValueAtTime(0.25, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                                osc.connect(gain);
                                gain.connect(ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.16);
                            }
                            break;

                        case 11: // Crafting Success Chime
                            {
                                const osc1 = ctx.createOscillator();
                                const gain1 = ctx.createGain();
                                osc1.type = 'triangle';
                                osc1.frequency.setValueAtTime(587.33, now);
                                gain1.gain.setValueAtTime(0.20, now);
                                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                                osc1.connect(gain1);
                                gain1.connect(ctx.destination);
                                osc1.start(now);
                                osc1.stop(now + 0.16);

                                const osc2 = ctx.createOscillator();
                                const gain2 = ctx.createGain();
                                osc2.type = 'triangle';
                                osc2.frequency.setValueAtTime(880.00, now + 0.12);
                                gain2.gain.setValueAtTime(0.22, now + 0.12);
                                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                                osc2.connect(gain2);
                                gain2.connect(ctx.destination);
                                osc2.start(now + 0.12);
                                osc2.stop(now + 0.38);
                            }
                            break;

                        case 12: // UI Click / Selection Blip
                            {
                                const osc = ctx.createOscillator();
                                const gain = ctx.createGain();
                                osc.type = 'sine';
                                osc.frequency.setValueAtTime(920, now);
                                gain.gain.setValueAtTime(0.12, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
                                osc.connect(gain);
                                gain.connect(ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.04);
                            }
                            break;

                        case 13: // Safe Zone Entry Hum
                            {
                                const osc = ctx.createOscillator();
                                const gain = ctx.createGain();
                                osc.type = 'sine';
                                osc.frequency.setValueAtTime(330, now);
                                osc.frequency.linearRampToValueAtTime(440, now + 0.25);
                                gain.gain.setValueAtTime(0.08, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                                osc.connect(gain);
                                gain.connect(ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.32);
                            }
                            break;

                        case 14: // Respawn / Re-entry Warp Power-up
                            {
                                const chord = [220, 329.63, 440, 659.25, 880];
                                chord.forEach((freq, idx) => {
                                    const noteTime = now + (idx * 0.07);
                                    const osc = ctx.createOscillator();
                                    const gain = ctx.createGain();
                                    osc.type = 'triangle';
                                    osc.frequency.setValueAtTime(freq, noteTime);
                                    gain.gain.setValueAtTime(0.18, noteTime);
                                    gain.gain.exponentialRampToValueAtTime(0.001, noteTime + 0.28);
                                    osc.connect(gain);
                                    gain.connect(ctx.destination);
                                    osc.start(noteTime);
                                    osc.stop(noteTime + 0.30);
                                });
                            }
                            break;

                        case 15: // Critical Hull Low Warning Pulse
                            {
                                const osc = ctx.createOscillator();
                                const gain = ctx.createGain();
                                osc.type = 'sawtooth';
                                osc.frequency.setValueAtTime(780, now);
                                osc.frequency.setValueAtTime(920, now + 0.05);
                                gain.gain.setValueAtTime(0.16, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
                                osc.connect(gain);
                                gain.connect(ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.12);
                            }
                            break;
                    }
                } catch (e) {
                    console.warn("SFX error:", e);
                }
            }
        };

        window.addEventListener('click', () => SfxEngine.init(), { once: false });
        window.addEventListener('keydown', () => SfxEngine.init(), { once: false });

        // Global functions called from Rust / WASM or HUD
        window.astrobrawl = {
            getServerUrl: function() {
                return localStorage.getItem('astrobrawl_server_url') || serverInput.value || defaultWsUrl;
            },
            getAuthToken: function() {
                return localStorage.getItem('astrobrawl_auth_token') || 'guest';
            },
            updateHud: function(credits, minerals, score) {
                const hc = document.getElementById('hud-credits'); if (hc) hc.innerText = credits;
                const hm = document.getElementById('hud-minerals'); if (hm) hm.innerText = minerals;
                const hs = document.getElementById('hud-score'); if (hs) hs.innerText = score;
            },
            addKillFeed: function(msg) {
                const feed = document.getElementById('killfeed');
                const item = document.createElement('div');
                item.className = 'killfeed-item';
                item.innerText = msg;
                feed.appendChild(item);
                setTimeout(() => item.remove(), 4000);
            },
            toggleMute: function() {
                return SfxEngine.toggleMute();
            }
        };

        // Native WebSocket & Audio Miniquad Plugin
        let gameWs = null;
        let gameIncomingPackets = [];

        miniquad_add_plugin({
            name: "astrobrawl_net",
            version: 1,
            register_plugin: function(importObject) {
                importObject.env.mq_ws_connect = function(ptr, len) {
                    const url = UTF8ToString(ptr, len);
                    try {
                        gameWs = new WebSocket(url);
                        gameWs.binaryType = "arraybuffer";
                        gameWs.onmessage = function(e) {
                            gameIncomingPackets.push(new Uint8Array(e.data));
                        };
                    } catch (e) {
                        console.error("WS connect error:", e);
                    }
                };
                importObject.env.mq_ws_is_connected = function() {
                    return (gameWs && gameWs.readyState === WebSocket.OPEN) ? 1 : 0;
                };
                importObject.env.mq_ws_send = function(ptr, len) {
                    if (gameWs && gameWs.readyState === WebSocket.OPEN) {
                        const bytes = new Uint8Array(wasm_memory.buffer, ptr, len);
                        gameWs.send(bytes);
                    }
                };
                importObject.env.mq_ws_recv = function(dest_ptr, max_len) {
                    if (gameIncomingPackets.length === 0) return 0;
                    const pkt = gameIncomingPackets.shift();
                    const copyLen = Math.min(pkt.length, max_len);
                    const dest = new Uint8Array(wasm_memory.buffer, dest_ptr, copyLen);
                    dest.set(pkt.subarray(0, copyLen));
                    return copyLen;
                };
                importObject.env.mq_play_sfx = function(id) {
                    SfxEngine.play(id);
                };
                importObject.env.mq_toggle_mute = function() {
                    return SfxEngine.toggleMute() ? 1 : 0;
                };
                importObject.env.mq_save_progression = function(ptr, len) {
                    try {
                        const bytes = new Uint8Array(wasm_memory.buffer, ptr, len);
                        let binary = '';
                        for (let i = 0; i < bytes.byteLength; i++) {
                            binary += String.fromCharCode(bytes[i]);
                        }
                        localStorage.setItem('astrobrawl_save', btoa(binary));
                    } catch (e) {
                        console.error("Error saving progression:", e);
                    }
                };
                importObject.env.mq_load_progression = function(dest_ptr, max_len) {
                    try {
                        const b64 = localStorage.getItem('astrobrawl_save');
                        if (!b64) return 0;
                        const binary = atob(b64);
                        const copyLen = Math.min(binary.length, max_len);
                        const dest = new Uint8Array(wasm_memory.buffer, dest_ptr, copyLen);
                        for (let i = 0; i < copyLen; i++) {
                            dest[i] = binary.charCodeAt(i);
                        }
                        return copyLen;
                    } catch (e) {
                        console.error("Error loading progression:", e);
                        return 0;
                    }
                };
                importObject.env.mq_get_player_name = function(dest_ptr, max_len) {
                    try {
                        const name = localStorage.getItem('astrobrawl_username') || '';
                        if (!name) return 0;
                        const encoder = new TextEncoder();
                        const bytes = encoder.encode(name);
                        const copyLen = Math.min(bytes.length, max_len);
                        const dest = new Uint8Array(wasm_memory.buffer, dest_ptr, copyLen);
                        dest.set(bytes.subarray(0, copyLen));
                        return copyLen;
                    } catch (e) {
                        console.error("Error getting player name:", e);
                        return 0;
                    }
                };
            }
        });

        // Load WASM Game binary
        load("astrobrawl-client.wasm");
    </script>
</body>
</html>
