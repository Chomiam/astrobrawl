<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AstroBrawl - Dark Orbit 2D Multiplayer Space Shooter</title>
    
    <link data-trunk rel="copy-file" href="mq_js_bundle.js" />
    <link data-trunk rel="copy-file" href="vercel.json" />
    <link data-trunk rel="copy-file" href="../target/wasm32-unknown-unknown/release/astrobrawl-client.wasm" />

    <style>
        :root {
            /* Catppuccin Mocha Palette */
            --ctp-rosewater: #f5e0dc;
            --ctp-flamingo: #f2cdcd;
            --ctp-pink: #f5c2e7;
            --ctp-mauve: #cba6f7;
            --ctp-red: #f38ba8;
            --ctp-maroon: #eba0ac;
            --ctp-peach: #fab387;
            --ctp-yellow: #f9e2af;
            --ctp-green: #a6e3a1;
            --ctp-teal: #94e2d5;
            --ctp-sky: #89dceb;
            --ctp-sapphire: #74c7ec;
            --ctp-blue: #89b4fa;
            --ctp-lavender: #b4befe;
            --ctp-text: #cdd6f4;
            --ctp-subtext1: #bac2de;
            --ctp-subtext0: #a6adc8;
            --ctp-overlay2: #9399b2;
            --ctp-overlay1: #7f849c;
            --ctp-overlay0: #6c7086;
            --ctp-surface2: #585b70;
            --ctp-surface1: #45475a;
            --ctp-surface0: #313244;
            --ctp-base: #1e1e2e;
            --ctp-mantle: #181825;
            --ctp-crust: #11111b;

            --bg-dark: var(--ctp-crust);
            --panel-bg: rgba(24, 24, 37, 0.95);
            --panel-border: var(--ctp-surface1);
            --primary: var(--ctp-mauve);
            --primary-glow: rgba(203, 166, 247, 0.35);
            --text-main: var(--ctp-text);
            --text-muted: var(--ctp-subtext0);
            --font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-family);
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #glcanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            outline: none;
            display: block;
            z-index: 1;
            cursor: crosshair;
        }

        /* Killfeed / Log Box */
        #killfeed {
            position: absolute;
            top: 70px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }

        .killfeed-item {
            background: var(--panel-bg);
            border-left: 3px solid var(--ctp-peach);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            color: var(--ctp-text);
            animation: fadeIn 0.3s ease;
        }

        /* Login / Connect Modal */
        #auth-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(30, 30, 46, 0.90) 0%, rgba(17, 17, 27, 0.98) 100%);
            backdrop-filter: blur(10px);
            transition: opacity 0.3s ease;
        }

        #auth-overlay.hidden {
            display: none;
            opacity: 0;
            pointer-events: none;
        }

        .auth-card {
            width: 460px;
            max-width: 90vw;
            background: var(--ctp-mantle);
            border: 1.5px solid var(--ctp-mauve);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 0 40px var(--primary-glow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--ctp-mauve), transparent);
        }

        .game-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--ctp-text) 0%, var(--ctp-mauve) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 13px;
            color: var(--ctp-subtext0);
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            border: none;
        }

        .btn-github {
            background: var(--ctp-surface0);
            color: var(--ctp-text);
            border: 1px solid var(--ctp-surface2);
        }
        .btn-github:hover {
            background: var(--ctp-surface1);
            border-color: var(--ctp-mauve);
            box-shadow: 0 0 15px rgba(203, 166, 247, 0.25);
        }

        .btn-guest {
            background: linear-gradient(135deg, #1e66f5, #04a5e5);
            color: #fff;
        }
        .btn-guest:hover {
            background: linear-gradient(135deg, #7287fd, #209fb5);
            box-shadow: 0 0 20px rgba(114, 135, 253, 0.4);
            transform: translateY(-1px);
        }

        .input-group {
            margin-top: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--ctp-subtext0);
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            background: var(--ctp-surface0);
            border: 1px solid var(--ctp-surface1);
            border-radius: 6px;
            color: var(--ctp-text);
            font-size: 13px;
            outline: none;
        }
        .input-field:focus {
            border-color: var(--ctp-mauve);
            box-shadow: 0 0 10px var(--primary-glow);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Killfeed -->
        <div id="killfeed"></div>

        <!-- Auth & Connection Overlay -->
        <div id="auth-overlay">
            <div class="auth-card">
                <div class="game-title">⚡ ASTROBRAWL ⚡</div>
                <div class="game-subtitle">Multijoueur Spatial 2D • Dark Orbit Style</div>

                <div class="auth-buttons">
                    <button id="btn-login-guest" class="btn btn-guest">
                        🚀 Jouer Immédiatement (Mode Invité / Solo)
                    </button>

                    <button id="btn-login-github" class="btn btn-github">
                        <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                        </svg>
                        Connexion avec GitHub
                    </button>
                </div>

                <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4;">
                    ✨ Cliquez sur "Jouer Immédiatement" ou associez votre profil GitHub pour décoller !
                </div>

                <div class="input-group">
                    <label for="server-url">URL du Serveur Multijoueur :</label>
                    <input type="text" id="server-url" class="input-field" value="" placeholder="ws://localhost:3000/ws">
                </div>
            </div>
        </div>

        <!-- GitHub Profile Modal -->
        <div id="github-modal" class="modal-overlay hidden" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 110; display: none; align-items: center; justify-content: center; background: rgba(5, 7, 15, 0.95); backdrop-filter: blur(8px);">
            <div class="auth-card">
                <div class="game-title" style="font-size: 24px;">PILOTE GITHUB</div>
                <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 18px;">
                    Associez votre compte GitHub pour afficher votre avatar et votre identifiant de commandant !
                </div>

                <div class="input-group" style="margin-top: 0;">
                    <label for="github-username">Nom d'utilisateur GitHub :</label>
                    <input type="text" id="github-username" class="input-field" placeholder="ex: Chomiam" value="Chomiam">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 18px;">
                    <button id="btn-validate-github" class="btn btn-github" style="flex: 1;">
                        ⭐ Valider le Profil
                    </button>
                    <button id="btn-cancel-github" class="btn" style="background: rgba(255,255,255,0.1); color: #fff; width: 90px;">
                        Retour
                    </button>
                </div>

                <div id="github-status" style="margin-top: 12px; font-size: 12px; min-height: 18px;"></div>
            </div>
        </div>

        <!-- Macroquad Canvas -->
        <canvas id="glcanvas" tabindex="1"></canvas>
    </div>

    <!-- Macroquad WebGL / WASM Loader -->
    <script src="mq_js_bundle.js"></script>
    <script>
        // Prevent default Tab key navigation so game controls capture Tab targeting
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
            }
        });

        // Server URL configuration
        const defaultWsUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + 
                             (window.location.hostname === 'localhost' ? 'localhost:3000' : window.location.host) + '/ws';
        
        const serverInput = document.getElementById('server-url');
        serverInput.value = localStorage.getItem('astrobrawl_server_url') || defaultWsUrl;

        serverInput.addEventListener('change', () => {
            localStorage.setItem('astrobrawl_server_url', serverInput.value);
        });

        // Check URL search parameters for OAuth callback token
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        if (tokenFromUrl) {
            localStorage.setItem('astrobrawl_auth_token', tokenFromUrl);
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // GitHub Modal handling
        const ghModal = document.getElementById('github-modal');
        const ghStatus = document.getElementById('github-status');

        document.getElementById('btn-login-github').addEventListener('click', (e) => {
            e.preventDefault();
            ghModal.style.display = 'flex';
            document.getElementById('github-username').focus();
        });

        document.getElementById('btn-cancel-github').addEventListener('click', () => {
            ghModal.style.display = 'none';
        });

        document.getElementById('btn-validate-github').addEventListener('click', async () => {
            const usernameInput = document.getElementById('github-username').value.trim();
            if (!usernameInput) {
                ghStatus.style.color = 'var(--accent-orange)';
                ghStatus.innerText = 'Veuillez saisir un pseudo GitHub.';
                return;
            }

            ghStatus.style.color = 'var(--primary)';
            ghStatus.innerText = 'Vérification du profil GitHub en cours...';

            try {
                const res = await fetch(`https://api.github.com/users/${encodeURIComponent(usernameInput)}`);
                if (res.ok) {
                    const profile = await res.json();
                    localStorage.setItem('astrobrawl_username', profile.login);
                    localStorage.setItem('astrobrawl_auth_token', 'gh_' + profile.id);
                    localStorage.setItem('astrobrawl_avatar', profile.avatar_url);
                    ghStatus.style.color = 'var(--accent-green)';
                    ghStatus.innerText = `Connecté avec succès : @${profile.login} !`;
                    setTimeout(() => {
                        ghModal.style.display = 'none';
                        startGameSession('gh_' + profile.id, profile.login);
                    }, 600);
                } else {
                    localStorage.setItem('astrobrawl_username', usernameInput);
                    localStorage.setItem('astrobrawl_auth_token', 'gh_custom');
                    ghModal.style.display = 'none';
                    startGameSession('gh_custom', usernameInput);
                }
            } catch (err) {
                localStorage.setItem('astrobrawl_username', usernameInput);
                localStorage.setItem('astrobrawl_auth_token', 'gh_custom');
                ghModal.style.display = 'none';
                startGameSession('gh_custom', usernameInput);
            }
        });

        // Guest login click
        document.getElementById('btn-login-guest').addEventListener('click', async () => {
            const storedName = localStorage.getItem('astrobrawl_username') || 'Pilote Invité';
            startGameSession('guest_offline', storedName);
        });

        function startGameSession(token, username) {
            document.getElementById('auth-overlay').classList.add('hidden');
            const avatarUrl = localStorage.getItem('astrobrawl_avatar');
            const playerSpan = document.getElementById('hud-player');
            if (playerSpan) {
                if (avatarUrl) {
                    playerSpan.innerHTML = `<img src="${avatarUrl}" style="width: 18px; height: 18px; border-radius: 50%; vertical-align: middle; margin-right: 5px;"> ${username}`;
                } else {
                    playerSpan.innerText = username || 'Pilote';
                }
            }
            document.getElementById('glcanvas').focus();
        }

        // Auto-login if token exists
        const storedToken = localStorage.getItem('astrobrawl_auth_token');
        const storedUsername = localStorage.getItem('astrobrawl_username');
        if (storedToken) {
            startGameSession(storedToken, storedUsername);
        }

        function triggerKey(keyChar) {
            const canvas = document.getElementById('glcanvas');
            canvas.focus();
            const keyCode = keyChar.toUpperCase().charCodeAt(0);
            const eventDown = new KeyboardEvent('keydown', { key: keyChar, code: 'Key' + keyChar.toUpperCase(), keyCode: keyCode, which: keyCode, bubbles: true });
            window.dispatchEvent(eventDown);
            setTimeout(() => {
                const eventUp = new KeyboardEvent('keyup', { key: keyChar, code: 'Key' + keyChar.toUpperCase(), keyCode: keyCode, which: keyCode, bubbles: true });
                window.dispatchEvent(eventUp);
            }, 60);
        }

        // Global functions called from Rust / WASM or HUD
        window.astrobrawl = {
            getServerUrl: function() {
                return localStorage.getItem('astrobrawl_server_url') || serverInput.value || defaultWsUrl;
            },
            getAuthToken: function() {
                return localStorage.getItem('astrobrawl_auth_token') || 'guest';
            },
            updateHud: function(credits, minerals, score) {
                const hc = document.getElementById('hud-credits'); if (hc) hc.innerText = credits;
                const hm = document.getElementById('hud-minerals'); if (hm) hm.innerText = minerals;
                const hs = document.getElementById('hud-score'); if (hs) hs.innerText = score;
            },
            addKillFeed: function(msg) {
                const feed = document.getElementById('killfeed');
                const item = document.createElement('div');
                item.className = 'killfeed-item';
                item.innerText = msg;
                feed.appendChild(item);
                setTimeout(() => item.remove(), 4000);
            }
        };

        // Native WebSocket Miniquad Plugin
        let gameWs = null;
        let gameIncomingPackets = [];

        miniquad_add_plugin({
            name: "astrobrawl_net",
            version: 1,
            register_plugin: function(importObject) {
                importObject.env.mq_ws_connect = function(ptr, len) {
                    const url = UTF8ToString(ptr, len);
                    try {
                        gameWs = new WebSocket(url);
                        gameWs.binaryType = "arraybuffer";
                        gameWs.onmessage = function(e) {
                            gameIncomingPackets.push(new Uint8Array(e.data));
                        };
                    } catch (e) {
                        console.error("WS connect error:", e);
                    }
                };
                importObject.env.mq_ws_is_connected = function() {
                    return (gameWs && gameWs.readyState === WebSocket.OPEN) ? 1 : 0;
                };
                importObject.env.mq_ws_send = function(ptr, len) {
                    if (gameWs && gameWs.readyState === WebSocket.OPEN) {
                        const bytes = new Uint8Array(wasm_memory.buffer, ptr, len);
                        gameWs.send(bytes);
                    }
                };
                importObject.env.mq_ws_recv = function(dest_ptr, max_len) {
                    if (gameIncomingPackets.length === 0) return 0;
                    const pkt = gameIncomingPackets.shift();
                    const copyLen = Math.min(pkt.length, max_len);
                    const dest = new Uint8Array(wasm_memory.buffer, dest_ptr, copyLen);
                    dest.set(pkt.subarray(0, copyLen));
                    return copyLen;
                };
            }
        });

        // Load WASM Game binary
        load("astrobrawl-client.wasm");
    </script>
</body>
</html>
